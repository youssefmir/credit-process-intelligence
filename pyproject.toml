[project]
name = "credit-process-intelligence"
version = "1.0.0"
description = "Process mining, KPI, prédiction des abandons et business case IA sur un processus réel de crédit à la consommation (BPI Challenge 2012)."
authors = [{ name = "Youssef Mir" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jinja2>=3.1",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pm4py>=2.7.11",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "mypy>=1.10",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[project.scripts]
cpi = "cpi.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PD", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003", "PD010"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]

[tool.mypy]
python_version = "3.12"
packages = ["cpi"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
